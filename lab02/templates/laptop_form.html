<!-- templates/laptops/laptop_form.html -->
{% extends "base_generic.html" %}

{% block title %}{% if form.instance.pk %}Edit Laptop{% else %}Add Laptop{% endif %}{% endblock %}

{% block content %}
  <h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Laptop</h2>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      {{ form.as_p }}
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{% url 'Home Page' %}">Cancel</a>
  </form>
{% endblock %}
